  <style>


.top-bar{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:flex-end;

  gap:20px;

  padding:25px 25px;
}

/* =========================
   MARQUEE
   ========================= */

.custom-marquee{
  width:1100px;   /* NOT full width */
  height:38px;

  overflow:hidden;

  border:1px solid #fff;

  display:flex;
  align-items:center;

  position:relative;
}

/* Moving text */
.marquee-track{
  display:flex;
  width:max-content;

  animation: marqueeMove 15s linear infinite;
}

.marquee-track span{
  color:#fff;

  white-space:nowrap;

  font-size:14px;
  letter-spacing:2px;

  padding-right:60px;
}

/* Animation */
@keyframes marqueeMove{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

/* =========================
   MENU BUTTON
   ========================= */

.menu-btn{
  background:none;
  border:none;

  color:#fff;

  font-size:32px;
  cursor:pointer;
}

.marquee-container {
    overflow: hidden; /* Hide the overflow */
    white-space: nowrap; /* Keep text on one line */
    background: #f8f9fa; /* Optional: Bootstrap light bg */
    padding: 10px 0;
}

.marquee-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 15s linear infinite; /* Adjust speed here */
}

@keyframes marquee {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-100%, 0); }
}

/* Reduce offcanvas width */
.offcanvas{
  width: 260px !important; /* adjust size here */
  background: #fff;
}

/* Make all menu text black */
.offcanvas-title,
.nav-link{
  color: #000 !important;
}

/* Optional hover effect */
.nav-link:hover{
  color: #444 !important;
}

/* Make close button black too */
.btn-close{
  filter: none;
}




.navbar-toggler-icon{
  background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255,255,255,1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e")

  }

  
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, Helvetica, sans-serif;
      background:#f2f2f2;
    }

    .gallery-wrapper{
      width:100%;
      overflow-x:auto;
      overflow-y:hidden;
      padding:24px 16px;
      scroll-behavior:smooth;

      /* smooth scrolling on mobile */
      -webkit-overflow-scrolling: touch;
    }

    .gallery{
      display:flex;
      gap:20px;
      width:max-content;
    }

    .card{
      width:320px;
      min-width:320px;
      background:#fff;
      border-radius:12px;
      overflow:hidden;
      border:1px solid #d9d9d9;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
      flex-shrink:0;
    }

    .image-box{
      width:100%;
      height:420px; /* SAME HEIGHT FOR ALL IMAGES */
      overflow:hidden;
      background:#eee;
    }

    .image-box img{
      width:100%;
      height:100%;
      object-fit:cover; /* keeps equal height */
      display:block;
    }

    .card-content{
      padding:18px 16px 22px;
      text-align:center;
    }

    .product-title{
      font-size:18px;
      line-height:1.4;
      margin-bottom:14px;
      color:#222;
    }

    .price{
      font-size:24px;
      margin-bottom:18px;
      color:#111;
    }

    .btn{
      border:none;
      background:#000;
      color:#fff;
      padding:12px 22px;
      border-radius:6px;
      cursor:pointer;
      font-size:15px;
      transition:0.2s ease;
    }

    .btn:hover{
      opacity:0.85;
    }

    /* MOBILE */
    @media (max-width: 768px){

      .gallery-wrapper{
        padding:16px 12px;
      }

      .gallery{
        gap:14px;
      }

      .card{
        width:260px;
        min-width:260px;
      }

      .image-box{
        height:340px;
      }

      .product-title{
        font-size:16px;
      }

      .price{
        font-size:20px;
      }
    }
 
  



    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Inconsolata ;
      background:#f8f8f8;
      color:#111;
    }

    .cart-page{
      max-width:1100px;
      margin:auto;
      padding:40px 30px 60px;
    }

    /* TOP */
    .cart-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      margin-bottom:35px;
    }

    .cart-top h1{
      font-size:40px;
      font-weight:400;
      letter-spacing:-2px;
    }

    .continue-shopping{
      font-size:15px;
      color:#8d837c;
      text-decoration:none;
      border-bottom:1px solid #b7aea7;
      padding-bottom:2px;
      margin-top:15px;
    }

    /* TABLE HEADER */
    .cart-header{
      display:grid;
      grid-template-columns: 1.8fr 1fr 120px;
      padding-bottom:18px;
      border-bottom:1px solid #e2e2e2;
      margin-bottom:35px;
      color:#9d9d9d;
      font-size:11px;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    .cart-header span:last-child{
      text-align:right;
    }

    /* CART ITEM */
    .cart-item{
      display:grid;
      grid-template-columns: 1.8fr 1fr 120px;
      align-items:flex-start;
      gap:20px;
      padding-bottom:45px;
      border-bottom:1px solid #e5e5e5;
    }

    .product-info{
      display:flex;
      gap:35px;
    }

    .product-image{
      width:98px;
      height:125px;
      border:1px solid #ececec;
      border-radius:8px;
      overflow:hidden;
      flex-shrink:0;
      background:#fff;
    }

    .product-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .product-details h3{
      font-size:25px;
      font-weight:400;
      margin-bottom:10px;
    }

    .product-details p{
      font-size:25px;
      color:#444;
    }

    /* QUANTITY */
    .quantity-area{
      display:flex;
      align-items:center;
      gap:18px;
      justify-content:center;
    }

    .quantity-box{
      width:170px;
      height:58px;
      border:1px solid #9b928c;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      background:white;
    }

    .quantity-box button{
      background:none;
      border:none;
      font-size:26px;
      cursor:pointer;
      color:#555;
    }

    .quantity-box span{
      font-size:22px;
    }

    .delete-btn{
      background:none;
      border:none;
      cursor:pointer;
      font-size:20px;
      color:#8d837c;
    }

    /* PRICE */
    .product-total{
      text-align:right;
      font-size:27px;
      font-weight:400;
    }

    /* SUMMARY */
    .cart-summary{
      width:360px;
      margin-left:auto;
      margin-top:70px;
    }

    .summary-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .summary-row h2{
      font-size:28px;
      font-weight:400;
    }

    .summary-row span{
      font-size:28px;
      color:#000000;
    }

    .summary-note{
      text-align:center;
      font-size:14px;
      color:#7c7c7c;
      margin-bottom:30px;
      line-height:1.6;
    }

    .checkout-btn{
      width:100%;
      height:68px;
      border:none;
      border-radius:6px;
      background:#857970;
      color:white;
      font-size:22px;
      cursor:pointer;
      transition:0.3s;
    }

    .checkout-btn:hover{
      background:#6f655e;
    }

    /* MOBILE */
    @media(max-width:768px){

      .cart-page{
        padding:25px 16px 40px;
      }

      .cart-top h1{
        font-size:28px;
        letter-spacing:0;
      }

      .continue-shopping{
        font-size:12px;
        margin-top:8px;
      }

      .cart-header{
        grid-template-columns: 1fr 100px;
        font-size:9px;
        margin-bottom:25px;
      }

      .cart-header span:nth-child(2){
        display:none;
      }

      .cart-item{
        grid-template-columns:1fr 100px;
        gap:10px;
        padding-bottom:30px;
      }

      .product-info{
        gap:15px;
        align-items:flex-start;
      }

      .product-image{
        width:72px;
        height:92px;
      }

      .product-details h3{
        font-size:18px;
        margin-bottom:6px;
      }

      .product-details p{
        font-size:16px;
      }

      .quantity-area{
        grid-column:1/2;
        margin-left:87px;
        margin-top:10px;
        justify-content:flex-start;
      }

      .quantity-box{
        width:120px;
        height:42px;
        padding:0 14px;
      }

      .quantity-box button{
        font-size:18px;
      }

      .quantity-box span{
        font-size:16px;
      }

      .delete-btn{
        font-size:14px;
      }

      .product-total{
        font-size:18px;
        align-self:flex-start;
      }

      .cart-summary{
        width:100%;
        margin-top:35px;
      }

      .summary-row h2{
        font-size:20px;
      }

      .summary-row span{
        font-size:24px;
      }

      .summary-note{
        font-size:12px;
        margin-bottom:18px;
      }

      .checkout-btn{
        height:54px;
        font-size:18px;
      }
    }
  </style>
</head>
