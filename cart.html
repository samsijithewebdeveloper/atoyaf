<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart Page</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: Inconsolata;
  background:#f8f8f8;
  color:#111;
}

/* =========================
   DESKTOP NAVIGATION
========================= */

.desktop-nav{
  position:fixed;
  top:22px;
  right:34px;
  z-index:500;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.desktop-menu-btn{
  width:28px;
  height:28px;
  border:1px solid #111;
  background:#f3f3f3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  margin-bottom:18px;
}

.desktop-nav ul{
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:18px;
  align-items:center;
  justify-content:center;
  padding-left:0;
  margin:0;
}

.desktop-nav a{
  font-size:20px;
  font-weight:800;
  letter-spacing:.5px;
  text-transform:uppercase;
  color:#000;
  text-shadow:
    1px 1px 0 rgba(0,0,0,.14);
  text-decoration:none;
}

/* =========================
   MOBILE NAVIGATION
========================= */

.offcanvas{
  width:260px !important;
  background:#fff;
}

.offcanvas-title,
.nav-link{
  color:#000 !important;
}

.nav-link:hover{
  color:#444 !important;
}

.btn-close{
  filter:none;
}

.navbar-toggler-icon{
  background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255,255,255,1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
}

/* =========================
   CART PAGE
========================= */

.cart-page{
  max-width:1100px;
  margin:auto;
  padding:40px 140px 60px 30px;
}

.cart-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:35px;
}

.cart-top h1{
  font-size:40px;
  font-weight:400;
  letter-spacing:-2px;
}

.continue-shopping{
  font-size:15px;
  color:#8d837c;
  text-decoration:none;
  border-bottom:1px solid #b7aea7;
  padding-bottom:2px;
  margin-top:15px;
}

.cart-header{
  display:grid;
  grid-template-columns:1.8fr 1fr 120px;
  padding-bottom:18px;
  border-bottom:1px solid #e2e2e2;
  margin-bottom:35px;
  color:#9d9d9d;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.cart-header span:last-child{
  text-align:right;
}

.cart-item{
  display:grid;
  grid-template-columns:1.8fr 1fr 120px;
  align-items:flex-start;
  gap:20px;
  padding-bottom:45px;
  border-bottom:1px solid #e5e5e5;
}

.product-info{
  display:flex;
  gap:35px;
}

.product-image{
  width:98px;
  height:125px;
  border:1px solid #ececec;
  border-radius:8px;
  overflow:hidden;
  flex-shrink:0;
  background:#fff;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.product-details h3{
  font-size:25px;
  font-weight:400;
  margin-bottom:10px;
}

.product-details p{
  font-size:25px;
  color:#444;
}

.quantity-area{
  display:flex;
  align-items:center;
  gap:18px;
  justify-content:center;
}

.quantity-box{
  width:170px;
  height:58px;
  border:1px solid #9b928c;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:white;
}

.quantity-box button{
  background:none;
  border:none;
  font-size:26px;
  cursor:pointer;
  color:#555;
}

.quantity-box span{
  font-size:22px;
}

.delete-btn{
  background:none;
  border:none;
  cursor:pointer;
  font-size:20px;
  color:#8d837c;
}

.product-total{
  text-align:right;
  font-size:27px;
  font-weight:400;
}

.cart-summary{
  width:360px;
  margin-left:auto;
  margin-top:70px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.summary-row h2{
  font-size:28px;
  font-weight:400;
}

.summary-row span{
  font-size:28px;
  color:#000;
}

.summary-note{
  text-align:center;
  font-size:14px;
  color:#7c7c7c;
  margin-bottom:30px;
  line-height:1.6;
}

.checkout-btn{
  width:100%;
  height:68px;
  border:none;
  border-radius:6px;
  background:#857970;
  color:white;
  font-size:22px;
  cursor:pointer;
  transition:0.3s;
}

.checkout-btn:hover{
  background:#6f655e;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

  .desktop-nav{
    display:none;
  }

  .cart-page{
    padding:25px 16px 40px;
  }

  .cart-top h1{
    font-size:28px;
    letter-spacing:0;
  }

  .continue-shopping{
    font-size:12px;
    margin-top:8px;
  }

  .cart-header{
    grid-template-columns:1fr 100px;
    font-size:9px;
    margin-bottom:25px;
  }

  .cart-header span:nth-child(2){
    display:none;
  }

  .cart-item{
    grid-template-columns:1fr 100px;
    gap:10px;
    padding-bottom:30px;
  }

  .product-info{
    gap:15px;
    align-items:flex-start;
  }

  .product-image{
    width:72px;
    height:92px;
  }

  .product-details h3{
    font-size:18px;
    margin-bottom:6px;
  }

  .product-details p{
    font-size:16px;
  }

  .quantity-area{
    grid-column:1/2;
    margin-left:87px;
    margin-top:10px;
    justify-content:flex-start;
  }

  .quantity-box{
    width:120px;
    height:42px;
    padding:0 14px;
  }

  .quantity-box button{
    font-size:18px;
  }

  .quantity-box span{
    font-size:16px;
  }

  .delete-btn{
    font-size:14px;
  }

  .product-total{
    font-size:18px;
    align-self:flex-start;
  }

  .cart-summary{
    width:100%;
    margin-top:35px;
  }

  .summary-row h2{
    font-size:20px;
  }

  .summary-row span{
    font-size:24px;
  }

  .summary-note{
    font-size:12px;
    margin-bottom:18px;
  }

  .checkout-btn{
    height:54px;
    font-size:18px;
  }
}

</style>
</head>

<body>

<!-- DESKTOP NAVIGATION -->

<nav class="desktop-nav">

  <button class="desktop-menu-btn">
    ☰
  </button>

  <ul>
    <li><a href="./index.html">HOME</a></li>
    <li><a href="#">COLLECTION</a></li>
    <li><a href="./index.html">SHOP</a></li>
    <li><a href="#">ABOUT</a></li>
    <li><a href="./cart.html">CART</a></li>
    <li><a href="#">CONTACT</a></li>
  </ul>

</nav>

<!-- MOBILE NAVIGATION -->

<nav class="navbar navbar-light text-bg-dark d-md-none">

  <div class="container-fluid">

    <a class="navbar-brand" href="#"></a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasNavbar"
      aria-controls="offcanvasNavbar"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="offcanvasNavbar"
      aria-labelledby="offcanvasNavbarLabel">

      <div class="offcanvas-header">

        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">
          Ato-yaf
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close">
        </button>

      </div>

      <div class="offcanvas-body">

        <ul class="navbar-nav justify-content-end flex-grow-1 pe-2">

          <li class="nav-item">
            <a class="nav-link active" href="./index.html">
              Shop
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">
              Collection
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">
              About
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="./cart.html">
              Cart
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">
              Contact
            </a>
          </li>

        </ul>

      </div>

    </div>

  </div>

</nav>

<div class="cart-page">

  <!-- TOP -->
  <div class="cart-top">

    <h1>Your cart</h1>

    <a href="#" class="continue-shopping">
      Continue shopping
    </a>

  </div>

  <!-- HEADER -->
  <div class="cart-header">

    <span>Product</span>
    <span>Quantity</span>
    <span>Total</span>

  </div>

  <!-- CART ITEM -->
  <div class="cart-item">

    <!-- LEFT -->
    <div class="product-info">

      <div class="product-image">
        <img src="./goal images/image (3).png" alt="">
      </div>

      <div class="product-details">

        <h3>cat ball</h3>

        <p>$500.00</p>

      </div>

    </div>

    <!-- QUANTITY -->
    <div class="quantity-area">

      <div class="quantity-box">

        <button>-</button>

        <span>1</span>

        <button>+</button>

      </div>

      <button class="delete-btn">
        🗑
      </button>

    </div>

    <!-- TOTAL -->
    <div class="product-total">
      $500.00
    </div>

  </div>

  <!-- SUMMARY -->
  <div class="cart-summary">

    <div class="summary-row">

      <h2>Estimated total</h2>

      <span>$500.00 USD</span>

    </div>

    <p class="summary-note">
      Taxes, discounts and shipping calculated at checkout.
    </p>

    <button class="checkout-btn">
      Check out
    </button>

  </div>

</div>

</body>
</html>
