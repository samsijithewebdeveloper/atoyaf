*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  min-height:100vh;
  font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   TOP BAR
   ========================= */

.top-bar{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:flex-end;

  gap:20px;

  padding:25px 25px;
}

/* =========================
   MARQUEE
   ========================= */

.custom-marquee{
  width:1100px;   /* NOT full width */
  height:38px;

  overflow:hidden;

  border:1px solid #fff;

  display:flex;
  align-items:center;

  position:relative;
}

/* Moving text */
.marquee-track{
  display:flex;
  width:max-content;

  animation: marqueeMove 15s linear infinite;
}

.marquee-track span{
  color:#fff;

  white-space:nowrap;

  font-size:14px;
  letter-spacing:2px;

  padding-right:60px;
}

/* Animation */
@keyframes marqueeMove{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

/* =========================
   MENU BUTTON
   ========================= */

.menu-btn{
  background:none;
  border:none;

  color:#fff;

  font-size:32px;
  cursor:pointer;
}

.marquee-container {
    overflow: hidden; /* Hide the overflow */
    white-space: nowrap; /* Keep text on one line */
    background: #f8f9fa; /* Optional: Bootstrap light bg */
    padding: 10px 0;
}

.marquee-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 15s linear infinite; /* Adjust speed here */
}

@keyframes marquee {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-100%, 0); }
}

/* Reduce offcanvas width */
.offcanvas{
  width: 260px !important; /* adjust size here */
  background: #fff;
}

/* Make all menu text black */
.offcanvas-title,
.nav-link{
  color: #000 !important;
}

/* Optional hover effect */
.nav-link:hover{
  color: #444 !important;
}

/* Make close button black too */
.btn-close{
  filter: none;
}
